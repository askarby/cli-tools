name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hello:
    uses: ./.github/workflows/tool-pipeline.yml
    with:
      tool: hello
      lint-paths: src/tools/hello.ts
      # No tests for hello yet; the test job is skipped.

  herdrinator:
    uses: ./.github/workflows/tool-pipeline.yml
    with:
      tool: herdrinator
      lint-paths: src/tools/herdrinator.ts src/lib/herdrinator
      test-paths: src/lib/herdrinator
      smoke-args: --help

  dotty:
    uses: ./.github/workflows/tool-pipeline.yml
    with:
      tool: dotty
      lint-paths: src/tools/dotty.ts src/lib/dotty
      test-paths: src/lib/dotty
      smoke-args: --help

  shared:
    uses: ./.github/workflows/tool-pipeline.yml
    with:
      tool: shared
      lint-paths: src/lib/shared
      test-paths: src/lib/shared
      run-build: false

  scripts:
    uses: ./.github/workflows/tool-pipeline.yml
    with:
      tool: scripts
      lint-paths: scripts
      test-paths: scripts
      run-build: false
